<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Activity Model</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      min-height: 110px;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    #promptsContainer {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Activity Model</h1>
    </header>

    <div class="prompt-workflow">
      
      <!-- Multiline Input Card 1 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data 1</span>
          <button class="clear-btn" onclick="resetInput('inputModel')">Reset</button>
        </div>
        <label for="inputModel">[Model]</label>
        <textarea id="inputModel" class="dynamic-input" placeholder="Type or paste [Model] here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Multiline Input Card 2 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data 2</span>
          <button class="clear-btn" onclick="resetInput('inputNumPrompts')">Reset</button>
        </div>
        <label for="inputNumPrompts">[Number of Prompts]</label>
        <textarea id="inputNumPrompts" class="dynamic-input" placeholder="Type or paste [Number of Prompts] here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt Result Cards -->
      <div id="promptsContainer">
        <!-- Prompts injected by JavaScript -->
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        text: `যারা একজন প্রফেশনাল ডিজিট্যাল ক্রিয়েটর রূপে নীচের উল্লেখ করা Model-এ অনলাইন আয় করতে চায় – তাদের কোন কোন দিকে কোন কোন দক্ষতা থাকা একান্ত আবশ্যক?
ক্যাটেগরিতে ভাগ করে সেই সব দক্ষতাগুলোর একটা সঠিক লিস্ট বানিয়ে দাও – এক্কেবারে নাহলেই চলবে না কোনগুলো তা মার্ক করে দিতে ভুলো না 

Model: [Model]

১, এই পথের জন্য কতগুলি শাখা আছে?
২, এই পথে একজন প্রফেশনাল ডিজিট্যাল ক্রিয়েটর হিসেবে কোন ধরনের শাখার জন্য কোন ধরণের দক্ষতাগুচ্ছ আবশ্যিক? 
সব শাখাগুলো প্রয়োজনীয় দক্ষতা গুচ্ছগুলোকে নীচে দেওয়া তিনটি ভাগে ভাগ করো।
Level 1 — Essential Competency (যে শাখায় কাজ করবেন, সেই শাখার সব দক্ষতায় নিজে কাজ করতে পারার মতো দক্ষতা থাকতে হবে।)
Level 2 — Professional Competency (যে শাখায় কাজ করবেন, সেই শাখার সব সহায়ক দক্ষতাগুলোর মধ্যে নিজের ব্যবসার প্রয়োজন।)
Level 3 — Business Competency ((যে শাখায় কাজ করবেন, সেই শাখার সব Main activity পরিচালনা, Audience Growth, Monetization, Financial Management এবং Business Expansion-এর দক্ষতা।)

৩, এটা নীচে দেওয়া পথগুলোর কোনটার অন্তর্গত?

১. Platform-Paid Income
প্ল্যাটফর্ম আপনাকে টাকা দিচ্ছে।
YouTube Ads, Facebook Monetization, Creator Rewards, Live Gifts ইত্যাদি।
২. Brand-Paid Income
বিভিন্ন কোম্পানি বা ব্যবসা আপনাকে টাকা দিচ্ছে।
Sponsorship, UGC Creation, Brand Collaboration, Content Licensing ইত্যাদি।
৩. Audience-Paid Income
আপনার দর্শক, পাঠক বা সদস্যরা আপনাকে টাকা দিচ্ছেন।
Membership, Courses, Coaching, Paid Newsletter, Digital Products ইত্যাদি।
৪. Client-Paid Income
অন্য ব্যক্তি বা প্রতিষ্ঠান আপনার দক্ষতা ও পরিষেবার জন্য টাকা দিচ্ছে।
Freelancing, Graphic Design, Video Editing, Consulting, Website Development ইত্যাদি।
৫. Asset-Paid Income
আপনার তৈরি সম্পদ থেকে বারবার বা দীর্ঘমেয়াদে আয় হচ্ছে।
Royalties, Licensing, Stock Assets, SaaS, Templates, Digital Libraries ইত্যাদি।`
      },
      {
        id: 2,
        text: `[Model] শুরু করার জন্য Level 1 এবং Level 2-এর কাজগুলো বিনা খরচে বা সবচেয়ে কম খরচে করার সেরা ফ্রি টুলগুলোর তালিকা দিন।`
      },
      {
        id: 3,
        text: `এই ফ্রি টুলগুলো ব্যবহার করে একজন নতুন ক্রিয়েটরের প্রথম ৭ দিনের একটি কাজের রুটিন তৈরি করে দিন।`
      },
      {
        id: 4,
        text: `নতুন ক্রিয়েটর হিসেবে দ্রুত আর্টিকেল ও ভিডিও স্ক্রিপ্টের আউটলাইন তৈরি করার জন্য কার্যকরী AI প্রম্পটগুলো কী কী?`
      },
      {
        id: 5,
        text: `এই [Number of Prompts]টি প্রম্পট এবং ডাইনামিক ইনপুট ফিল্ডসহ একটি মোবাইল-রেসপন্সিভ সিঙ্গেল-ফাইল HTML প্রম্পট জেনারেটর পেজ তৈরি করে দিন।`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const modelVal = document.getElementById('inputModel').value.trim() || "[Model]";
      const numPromptsVal = document.getElementById('inputNumPrompts').value.trim() || "[Number of Prompts]";

      templates.forEach(t => {
        let updatedText = t.text;
        if (t.id === 1 || t.id === 2) {
          updatedText = updatedText.split('[Model]').join(modelVal);
        }
        if (t.id === 5) {
          updatedText = updatedText.split('[Number of Prompts]').join(numPromptsVal);
        }
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
</body>
</html>
