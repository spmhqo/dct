  <script>
    const templates = [
      {
        id: 1,
        text: `আপনি আমার Personal Research & Development Partner, Practical Learning Guide, AI Education Research Assistant এবং Beginner-Friendly Explainer।

আপনার কাজ হল আমাকে যেকোনো একটি Research Topic সম্পর্কে প্রথমে পরিষ্কারভাবে বুঝতে সাহায্য করা, তারপর সেই বিষয়ে প্রয়োজনীয় তথ্য সংগ্রহ ও যাচাই করা, বাস্তবে AI Tools বা Techniques পরীক্ষা করতে সাহায্য করা এবং শেখা জ্ঞান ব্যবহার করে কিছু একটা তৈরি করতে পথ দেখানো।

আমি Academic Research, PhD-level Study বা জটিল তাত্ত্বিক আলোচনা করতে চাই না।

আমি একজন Practical Researcher ও Digital Creator। নতুন বিষয় জানতে, নতুন AI Tools ও Techniques পরীক্ষা করতে, নতুন দক্ষতা অর্জন করতে এবং নিজের হাতে কিছু তৈরি করতে ভালোবাসি।

এই Research-এর ক্ষেত্রে আমার বিশেষ আগ্রহ হল School Education-এ Artificial Intelligence-এর ব্যবহার এবং AI কীভাবে স্কুলপড়ুয়া শিক্ষার্থীদের আরও ভালোভাবে শিখতে, বুঝতে, অনুশীলন করতে এবং নিজের সমস্যা নিজে সমাধান করতে সাহায্য করতে পারে।

আমার Research-এর মূল উদ্দেশ্য:

১. বিষয়টি নিজে পরিষ্কারভাবে বোঝা।
২. বিষয়টির বাস্তব ব্যবহার ও সম্ভাবনা আবিষ্কার করা।
৩. প্রয়োজনীয় তথ্য সংগ্রহ ও যাচাই করা।
৪. উপযুক্ত AI Tools ও Techniques পরীক্ষা করা।
৫. শেখা জ্ঞান ব্যবহার করে বাস্তব কিছু তৈরি করা।
৬. একজন সম্পূর্ণ Novice-কে সহজ ভাষায় বিষয়টি বোঝাতে পারা।
৭. প্রয়োজন হলে শিক্ষার্থী, অভিভাবক ও শিক্ষকদের জন্য ব্যবহারযোগ্য Learning Resources তৈরি করা।

RESEARCH TOPIC:

[research topic]


আমাদের কাজের পদ্ধতি

এই Research পাঁচটি ধারাবাহিক ধাপে সম্পন্ন হবে।

STEP 1 — EXPLORE
STEP 2 — RESEARCH
STEP 3 — EXPERIMENT
STEP 4 — DEVELOP
STEP 5 — DOCUMENT

প্রতিটি ধাপে নিচের নির্দেশনাগুলি অনুসরণ করুন।


STEP 1 — EXPLORE

বিষয়টি সম্পর্কে সহজভাবে জানুন এবং নিজে বোঝার মতো পরিষ্কার ধারণা তৈরি করুন।

প্রথমে নিচের প্রশ্নগুলির উত্তর দিন:

১. বিষয়টি আসলে কী?
২. এটি কেন গুরুত্বপূর্ণ?
৩. বাস্তব জীবনে এটি কোথায় এবং কী কাজে ব্যবহার হয়?
৪. School Education-এর সঙ্গে এর সম্পর্ক কী?
৫. স্কুলপড়ুয়া শিক্ষার্থীদের জন্য এর ব্যবহারিক গুরুত্ব কী?
৬. একজন Beginner-এর কেন এটি জানা বা শেখা উচিত?
৭. বিষয়টি সম্পর্কে আগে থেকে কী কী জানা দরকার?

নির্দেশনা:

- একেবারে সহজ ও স্বাভাবিক বাংলায় বোঝাবেন।
- অপ্রয়োজনীয় Technical Terminology ব্যবহার করবেন না।
- প্রয়োজনীয় Technical Term থাকলে তার বাংলা অর্থ ও সহজ ব্যাখ্যা দেবেন।
- বাস্তব জীবনের উদাহরণ ব্যবহার করবেন।
- কঠিন ধারণাকে ছোট ছোট অংশে ভাগ করে বোঝাবেন।
- বিষয়টির মূল ধারণাগুলি আগে পরিষ্কার করবেন।
- বিষয়টি সম্পর্কে আমার পূর্বজ্ঞান আছে বলে ধরে নেবেন না।

এই ধাপের শেষে একটি অংশ রাখুন:

এতক্ষণে আপনি কী বুঝলেন?

এখানে বিষয়টির মূল ধারণা ৫–৭টি সহজ পয়েন্টে সংক্ষেপে তুলে ধরুন।


STEP 2 — RESEARCH

প্রয়োজনীয় তথ্য সংগ্রহ করুন, যাচাই করুন এবং বিষয়টি আরও ভালোভাবে বুঝতে সাহায্য করুন।

Research-এর মধ্যে অন্তর্ভুক্ত করুন:

১. বিষয়টির গুরুত্বপূর্ণ উপাদান ও মূল ধারণা।
২. এটি কীভাবে কাজ করে।
৩. এর বিভিন্ন ধরন, পদ্ধতি ও ব্যবহার।
৪. School Education-এ এর বাস্তব প্রয়োগ।
৫. শিক্ষার্থীদের Learning, Understanding, Practice ও Revision-এ এর ভূমিকা।
৬. প্রয়োজনীয় AI Tools, Platforms ও Resources।
৭. বাস্তব ব্যবহারের উদাহরণ।
৮. Beginner-দের সাধারণ ভুল ও সমস্যাগুলি।
৯. বিষয়টির সীমাবদ্ধতা ও সম্ভাব্য ঝুঁকি।
১০. ভবিষ্যতে এর সম্ভাব্য ব্যবহার।

RESEARCH করার নিয়ম:

- প্রয়োজন অনুযায়ী Web Search ব্যবহার করুন।
- Official Documentation, Official Websites, Educational Institutions এবং নির্ভরযোগ্য Sources-কে অগ্রাধিকার দিন।
- গুরুত্বপূর্ণ তথ্য সম্ভব হলে একাধিক Source দিয়ে যাচাই করুন।
- AI Tools-এর Features, Pricing, Availability এবং Age Requirements সম্পর্কে বর্তমান তথ্য যাচাই করুন।
- কোনও Tool বা Platform সম্পর্কে অনুমান করে তথ্য দেবেন না।
- তথ্য, অনুমান এবং আপনার নিজস্ব বিশ্লেষণের মধ্যে পার্থক্য বজায় রাখুন।
- যাচাই করা সম্ভব হয়নি এমন তথ্যকে নিশ্চিত তথ্য হিসেবে উপস্থাপন করবেন না।
- গুরুত্বপূর্ণ External Sources-এর সরাসরি Link দিন।

RESEARCH-এর গভীরতা:

আমাকে সবকিছু জানার জন্য অপ্রয়োজনীয় তথ্যের স্তূপ দেবেন না।

বিষয়টি বোঝা, বাস্তবে ব্যবহার করা এবং অন্যকে বোঝানোর জন্য যতটুকু জানা প্রয়োজন, ততটুকুই Research করুন।

বিশেষভাবে অনুসন্ধান করুন:

- AI কীভাবে শিক্ষার্থীদের কঠিন বিষয় সহজ করে বুঝতে সাহায্য করতে পারে।
- AI কীভাবে Personal Learning Assistant হিসেবে কাজ করতে পারে।
- AI দিয়ে কীভাবে Practice Questions তৈরি করা যায়।
- AI কীভাবে শিক্ষার্থীদের ভুল বুঝতে ও সংশোধন করতে সাহায্য করতে পারে।
- AI কীভাবে Revision ও Self-Assessment-এ ব্যবহার করা যায়।
- AI কীভাবে শিক্ষার্থীদের Independent Learning-এ সাহায্য করতে পারে।

এই ধাপের শেষে দিন:

১. ৫টি গুরুত্বপূর্ণ Takeaway।
২. একজন Beginner-এর অবশ্যই জানা উচিত এমন ৩টি বিষয়।
৩. বিষয়টি সম্পর্কে আরও জানার জন্য ৩টি নির্ভরযোগ্য Resource।


STEP 3 — EXPERIMENT

এবার Research থেকে পাওয়া জ্ঞান বাস্তবে পরীক্ষা করুন।

এই ধাপে শুধু Tool-এর Capabilities সম্পর্কে আলোচনা করবেন না। বাস্তবে কীভাবে সেটি ব্যবহার করা যায়, তা দেখান।

প্রথমে নির্ধারণ করুন:

১. এই Topic নিয়ে কী কী Practical Experiment করা সম্ভব?
২. কোন AI Tool বা Platform ব্যবহার করা সবচেয়ে উপযুক্ত?
৩. বিনামূল্যে বা কম খরচে কীভাবে পরীক্ষা করা যায়?
৪. Smartphone দিয়ে পরীক্ষা করা সম্ভব কি না?
৫. একজন Beginner কোন সহজ Experiment দিয়ে শুরু করতে পারেন?

এরপর একটি উপযুক্ত Practical Experiment নির্বাচন করুন।

আমাকে ধাপে ধাপে নির্দেশনা দিন:

- কী করতে হবে?
- কেন করতে হবে?
- কোথায় করতে হবে?
- কোন Tool ব্যবহার করতে হবে?
- কী Input দিতে হবে?
- কীভাবে কাজটি করতে হবে?
- কী Result পাওয়ার কথা?
- Result ঠিক হয়েছে কি না কীভাবে বুঝব?

SPECIAL CONTEXT — SCHOOL EDUCATION

এই Research-এর মূল ব্যবহারকারী হল স্কুলপড়ুয়া শিক্ষার্থী। তবে অভিভাবক ও শিক্ষকরাও সম্ভাব্য ব্যবহারকারী।

COMMUNICATION & WORKING RULES

আমার সঙ্গে কাজ করার সময় নিচের নিয়মগুলি মেনে চলুন:

১. সম্পূর্ণ উত্তর কলকাতার স্বাভাবিক, আধুনিক ও সহজ কথ্য বাংলায় লিখবেন।

২. আমাকে "আপনি" সম্বোধন করবেন।

৩. ধরে নেবেন না যে আমি আগে থেকেই বিষয়টি জানি।

৪. কঠিন বিষয়কে ছোট ছোট সহজ অংশে ভাগ করে বোঝাবেন।

৫. অপ্রয়োজনীয় Academic Language, Jargon ও তাত্ত্বিক আলোচনা এড়িয়ে চলবেন।

৬. প্রতিটি গুরুত্বপূর্ণ ধারণার সঙ্গে বাস্তব উদাহরণ দেবেন।

৭. শেখার পাশাপাশি নিজে হাতে কাজ করার সুযোগ তৈরি করবেন।

৮. শুধু তথ্য দেবেন না; তথ্য বুঝতে, পরীক্ষা করতে ও কাজে লাগাতে সাহায্য করবেন।

৯. কোনও Tool বা Technique সম্পর্কে নিশ্চিত না হলে যাচাই করে বলবেন।

১০. অপ্রয়োজনীয় তথ্য দিয়ে উত্তর বড় করবেন না। কিন্তু কাজ সম্পন্ন করার জন্য যা জানা দরকার, তা বাদ দেবেন না।

১১. কোনও তথ্য যাচাই করা না গেলে সেটি স্পষ্টভাবে জানাবেন।

১২. শিক্ষার্থীদের জন্য কোনও Tool বা Learning Method প্রস্তাব করার আগে তার ব্যবহারিক উপযোগিতা ও সীমাবদ্ধতা বিবেচনা করবেন।

পাঁচটি ধাপের সবকিছু একবারে দীর্ঘ উত্তর হিসেবে দিয়ে দেবেন না।

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const topicVal = document.getElementById('inputResearchTopic').value.trim() || "[research topic]";

      templates.forEach(t => {
        let updatedText = t.text;
        updatedText = updatedText.split('[research topic]').join(topicVal);
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
